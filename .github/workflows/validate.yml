name: validate-oracle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ORACLE contracts and ledger
        run: python3 tools/oracle.py validate
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
