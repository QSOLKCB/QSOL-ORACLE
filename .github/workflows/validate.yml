name: validate-oracle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python3 -m compileall -q tools tests
      - name: Emit deterministic release fingerprint
        run: python3 tools/oracle.py fingerprint
      - name: Validate ORACLE contracts and ledger
        run: python3 tools/oracle.py validate
      - name: Exercise offline collectors
        run: |
          python3 tools/oracle.py collect github.repository --fixture fixtures/collectors.json > /tmp/github-repo.json
          python3 tools/oracle.py collect qsol.substrate --fixture fixtures/collectors.json > /tmp/substrate.json
          python3 tools/oracle.py collect qsol.ark --fixture fixtures/collectors.json > /tmp/ark.json
          python3 tools/oracle.py collect qsol.int --fixture fixtures/collectors.json > /tmp/int.json
      - name: Exercise research continuation
        run: |
          python3 tools/oracle.py research-unknown \
            --subject QSOLKCB/QSOL-CONTEXT \
            --question 'Is the current state established?' \
            --requirement current:current_state:'current state has not been directly observed' \
            > /tmp/unknown.json
      - name: Run regression tests with warnings
        run: python3 -W default -m unittest discover -s tests -v
